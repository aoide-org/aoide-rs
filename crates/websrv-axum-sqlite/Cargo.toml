[package]
name = "aoide-websrv-axum-sqlite"
description = "aoide - Routes and handlers for a web server (axum/SQLite)"
publish = false
version.workspace = true
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["json", "macros", "query"] }
serde.workspace = true
thiserror.workspace = true

# JSON Schema (optional)
schemars = { workspace = true, optional = true }

# Workspace dependencies
aoide-backend-webapi-json.workspace = true
aoide-repo.workspace = true
aoide-storage-sqlite.workspace = true
aoide-usecases-sqlite.workspace = true

[features]
default = []
json-schema = ["dep:schemars"]
