[package]
name = "aoide-file-collection-app"
description = "aoide - File collection application"
publish = false
version = { workspace = true }
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
directories.workspace = true
discro.workspace = true
itertools.workspace = true
env_logger.workspace = true
serde_json.workspace = true
url.workspace = true

[dependencies.aoide]
path = ".."
features = ["desktop-app", "async-file-dialog", "json-backend", "json-frontend", "sqlite-bundled"]

[dependencies.clap]
version = "4.6.7"
features = ["derive", "env"]

[dependencies.log]
workspace = true
features = ["release_max_level_debug"]

[dependencies.tokio]
workspace = true
features = ["macros", "rt-multi-thread"]

[dependencies.eframe]
version = "0.37.0"
default-features = false
features = ["default_fonts", "glow", "wayland"]

[dependencies.egui]
version = "0.37.0"
default-features = false

# Spotify integration
[dependencies.data-encoding]
workspace = true
optional = true

[dependencies.rand]
workspace = true
optional = true

[dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["rustls", "http2", "json", "query", "form"]
optional = true

[dependencies.serde]
workspace = true
features = ["derive"]
optional = true

[dependencies.sha2]
version = "0.11.1"
optional = true

# mimalloc
[dependencies.mimalloc]
version = "0.1.52"
optional = true

[features]
default = []
# Use mimalloc instead of the default allocator.
mimalloc = ["dep:mimalloc"]
# Create Spotify playlists from track search queries.
spotify = [
  "dep:data-encoding",
  "dep:rand",
  "dep:reqwest",
  "dep:serde",
  "dep:sha2",
  "tokio/net",
  "tokio/io-util",
  "tokio/time",
]
