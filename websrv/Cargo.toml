[package]
name = "aoide-websrv"
description = "aoide - Standalone web server with embedded SQLite database"
publish = false
version = { workspace = true }
repository.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8.9", default-features = false, features = ["http1", "macros", "tokio"] }
directories.workspace = true
discro.workspace = true
dotenvy = "0.15.7"
jiff.workspace = true
log = { workspace = true, features = ["release_max_level_debug"] }
parking_lot = "0.13.0"
ron.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing.workspace = true
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { workspace = true, features = ["serde"] }
utoipa = { version = "6.0.0", features = ["preserve_order", "preserve_path_order"] }
utoipa-axum = "0.3.0"
# The vendored Swagger UI avoids downloading it from GitHub during the build.
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

# Workspace dependencies
# The OpenAPI document is generated from the JSON schemas of all requests and responses.
aoide-backend-webapi-json = { "workspace" = true, features = ["json-schema", "tokio"] }
aoide-core = { "workspace" = true, features = ["json-schema", "serde"] }
aoide-repo-sqlite.workspace = true
aoide-storage-sqlite = { "workspace" = true, features = ["serde", "sqlite-bundled", "tokio"] }
aoide-usecases.workspace = true
aoide-usecases-sqlite.workspace = true
aoide-websrv-axum-sqlite = { workspace = true, features = ["json-schema"] }

# mimalloc
[dependencies.mimalloc]
version = "0.1.52"
optional = true

# launcher-ui
[dependencies.eframe]
version = "0.37.0"
optional = true
default-features = false
features = ["default_fonts", "glow", "wayland"]

[dependencies.egui]
version = "0.37.0"
optional = true
default-features = false

[dependencies.rfd]
version = "0.17.2"
optional = true
default-features = false
features = ["xdg-portal"]

[features]
default = ["json-schema", "launcher-ui"]

# Serve the JSON schemas of selected requests and responses at /api/schema.
json-schema = []

# Use mimalloc instead of the default allocator.
mimalloc = ["dep:mimalloc"]

# Enable the launcher UI.
launcher-ui = ["dep:eframe", "dep:egui", "dep:rfd"]
